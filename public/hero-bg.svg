<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="">
  <defs>
    <radialGradient id="glowA" cx="82%" cy="12%" r="55%"><stop offset="0" stop-color="#fbbf24" stop-opacity=".34"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx="8%" cy="96%" r="60%"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".45"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowC" cx="70%" cy="70%" r="45%"><stop offset="0" stop-color="#34d399" stop-opacity=".20"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a5b4fc"/><stop offset=".55" stop-color="#34d399"/><stop offset="1" stop-color="#fde68a"/></linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34d399" stop-opacity=".30"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></linearGradient>
    <linearGradient id="calm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1e1b4b" stop-opacity=".62"/><stop offset=".5" stop-color="#1e1b4b" stop-opacity=".22"/><stop offset="1" stop-color="#1e1b4b" stop-opacity="0"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <g id="spark"><path d="M0-14C1.5-5 5-1.5 14 0 5 1.5 1.5 5 0 14-1.5 5-5 1.5-14 0-5-1.5-1.5-5 0-14Z"/></g>
  </defs>
  <rect width="1600" height="900" fill="none"/>
  <rect width="1600" height="900" fill="url(#glowA)"/><rect width="1600" height="900" fill="url(#glowB)"/><rect width="1600" height="900" fill="url(#glowC)"/>
