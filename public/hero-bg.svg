  <g fill="#34d399" fill-opacity=".28"><circle cx="450" cy="692" r="20"/><circle cx="850" cy="562" r="20"/><circle cx="1250" cy="382" r="20"/><circle cx="1450" cy="272" r="20"/></g>
  <!-- rupee coins -->
  <g font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-weight="700" text-anchor="middle" fill="#fcd34d">
    <g opacity=".85"><circle cx="1330" cy="165" r="64" fill="#fbbf24" fill-opacity=".16" stroke="#fcd34d" stroke-opacity=".7" stroke-width="3"/><circle cx="1330" cy="165" r="50" fill="none" stroke="#fcd34d" stroke-opacity=".35" stroke-width="1.5"/><text x="1330" y="188" font-size="64" fill-opacity=".9">₹</text></g>
    <g opacity=".6"><circle cx="1510" cy="520" r="38" fill="#fbbf24" fill-opacity=".13" stroke="#fcd34d" stroke-opacity=".6" stroke-width="2.5"/><text x="1510" y="538" font-size="40" fill-opacity=".9">₹</text></g>
    <g opacity=".5"><circle cx="1110" cy="105" r="28" fill="#fbbf24" fill-opacity=".12" stroke="#fcd34d" stroke-opacity=".55" stroke-width="2"/><text x="1110" y="118" font-size="28" fill-opacity=".9">₹</text></g>
    <g opacity=".42"><circle cx="965" cy="770" r="46" fill="#fbbf24" fill-opacity=".1" stroke="#fcd34d" stroke-opacity=".5" stroke-width="2"/><text x="965" y="788" font-size="48" fill-opacity=".9">₹</text></g>
  </g>
  <!-- sparkles -->
  <g fill="#fff"><use href="#spark" x="1010" y="260" fill-opacity=".55"/><use href="#spark" x="1500" y="95" fill-opacity=".7" transform="translate(1500 95) scale(.8) translate(-1500 -95)"/><use href="#spark" x="760" y="140" fill-opacity=".35" transform="translate(760 140) scale(.6) translate(-760 -140)"/><use href="#spark" x="1180" y="560" fill-opacity=".3" transform="translate(1180 560) scale(.7) translate(-1180 -560)"/></g>
  <!-- keep the text side calm for readability -->
  <rect width="1600" height="900" fill="url(#calm)"/>
</svg>
