  <!-- growth curve -->
  <path d="M0 790C200 770 300 705 450 692S700 604 850 562S1100 432 1250 382S1450 262 1600 205V900H0Z" fill="url(#area)"/>
  <path d="M0 790C200 770 300 705 450 692S700 604 850 562S1100 432 1250 382S1450 262 1600 205" fill="none" stroke="url(#line)" stroke-width="5" stroke-linecap="round" filter="url(#soft)" opacity=".55"/>
  <path d="M0 790C200 770 300 705 450 692S700 604 850 562S1100 432 1250 382S1450 262 1600 205" fill="none" stroke="url(#line)" stroke-width="3.5" stroke-linecap="round"/>
